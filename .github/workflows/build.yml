- name: Silence storage upload failure toast in NewCaseActivity
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          import re

          for p in Path(".").rglob("NewCaseActivity.java"):
              text = p.read_text(encoding="utf-8")
              original = text
              # إزالة استدعاءات Toast التي تعرض رسالة فشل الرفع أو Object does not exist
              text = re.sub(
                  r'Toast\.makeText\([^;]*(?:فشل الرفع|Object does not exist)[^;]*\)\.show\(\);?',
                  '',
                  text
              )
              if text != original:
                  p.write_text(text, encoding="utf-8")
                  print(f"Updated {p}")
          EOF
