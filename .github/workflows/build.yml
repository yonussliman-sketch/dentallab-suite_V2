name: Build DentalLab APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug
      - run: |
          mkdir -p release-apks
          find . -path "*/build/outputs/apk/*" -name "*.apk" | while read apk; do
            case "$apk" in
              *clinics*|*Clinics*) cp "$apk" release-apks/DentalLab-Clinics.apk ;;
              *lab*|*Lab*) cp "$apk" release-apks/DentalLab-Lab.apk ;;
            esac
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
